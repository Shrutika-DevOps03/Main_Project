name: ecom-DAP tests

on:
  push:
    branches: [main]
    paths:
      - "ecom-DAP/**"
  pull_request:
    paths:
      - "ecom-DAP/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecom-DAP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ecom-DAP/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
